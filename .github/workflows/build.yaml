name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
    paths:
      - "Makefile"
      - "patches/**"
      - "profiles/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "Makefile"
      - "patches/**"
      - "profiles/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/build.yaml"

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.check.outputs.version }}
      is_tag: ${{ steps.check.outputs.is_tag }}
      is_pr: ${{ steps.check.outputs.is_pr }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check if build should run
        id: check
        run: |
          EXPECTED_VERSION=$(make --no-print-directory -s image-version)
          VERSION=$EXPECTED_VERSION
          should_build=false
          is_tag=false
          is_pr=false
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            should_build=true
            is_pr=true
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            should_build=true
            is_tag=true
            VERSION=${GITHUB_REF#refs/tags/}
            if [[ "$VERSION" != "$EXPECTED_VERSION" ]]; then
              echo "Tag $VERSION does not match package version $EXPECTED_VERSION" >&2
              exit 1
            fi
          elif git diff HEAD~1 HEAD -- Makefile | grep -Eq '^\+(TALOS_VERSION|IMAGE_REVISION) = '; then
            should_build=true
          fi
          {
            echo "should_build=$should_build"
            echo "version=$VERSION"
            echo "is_tag=$is_tag"
            echo "is_pr=$is_pr"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: imjasonh/setup-crane@v0.7
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up GitHub Actions bot user
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare (checkouts & patches)
        run: make checkouts patches

      - name: Boot compatibility regression tests
        run: make test

      - name: Overlay
        run: make overlay

      - name: Installer
        run: make installer

      - name: Verify artifacts
        run: make verify

      - name: Preserve candidate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: talos-rpi5-${{ needs.check-version.outputs.version }}
          path: |
            _out/installer-arm64.tar
            _out/metal-arm64.raw.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Create tag (if auto-release)
        if: needs.check-version.outputs.is_tag == 'false' && needs.check-version.outputs.is_pr != 'true'
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      - name: Release
        if: needs.check-version.outputs.is_pr != 'true'
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          make release TAG="$VERSION" REGISTRY_USERNAME="${{ github.repository_owner }}"

      - name: Create GitHub Release
        if: needs.check-version.outputs.is_pr != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          NOTES=$(cat <<EOF
          > ⚠️ Experimental build, use at your own risk.

          Talos with its upstream kernel, corrected U-Boot NVMe mappings, matching D0 device-tree aliases, and an EFI-variable fallback for upgrades. This image revision replaces the withdrawn v1.14.1 package. See COMPARISON.md for hardware validation limits.

          ### What's available

          - 📦 **Raw disk image** (\`metal-arm64.raw.zst\`) for fresh installs
          - ⚙️  **Installer image** (\`ghcr.io/${{ github.repository_owner }}/talos-rpi5-installer:${VERSION}\`) for upgrades

          ### Install

          - **Fresh install**
            - Download the raw disk image from this release
            - Flash with \`dd\` or your favorite tool

          - **Upgrade existing node**
            \`\`\`bash
            talosctl upgrade --nodes <NODE_IP> --image ghcr.io/${{ github.repository_owner }}/talos-rpi5-installer:${VERSION}
            \`\`\`

          EOF
          )
          gh release create \
            "${VERSION}" \
            ./_out/metal-arm64.raw.zst \
            --title "${VERSION}" \
            --prerelease \
            --notes "$NOTES"

name: Publish verified runtime alias

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Verified installer digest to publish under its Talos runtime version
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: imjasonh/setup-crane@v0.7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and publish alias for Tuppr
        env:
          EXPECTED_DIGEST: ${{ inputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="ghcr.io/$OWNER/talos-rpi5-installer"
          source_tag=$(make --no-print-directory -s image-version)
          runtime_tag=$(awk '/^TALOS_VERSION = / {print $3}' Makefile)
          [[ "$(crane digest "$image:$source_tag")" == "$EXPECTED_DIGEST" ]]
          crane config "$image@$EXPECTED_DIGEST" |
            jq -e --arg version "$runtime_tag" '.config.Labels["alpha.talos.dev/version"] == $version'
          crane tag "$image@$EXPECTED_DIGEST" "$runtime_tag"
          [[ "$(crane digest "$image:$runtime_tag")" == "$EXPECTED_DIGEST" ]]
          echo "Published $image:$runtime_tag -> $EXPECTED_DIGEST"
